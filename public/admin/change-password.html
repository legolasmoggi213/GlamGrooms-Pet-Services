<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password — Glam Grooms Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <h1>Change Password</h1>
      <p class="page-sub">Update your administrator account password.</p>

      <div class="panel" style="max-width: 580px;">
        <h3>Change Admin Password</h3>
        <p id="password-message" class="text-muted" style="margin-bottom: 1.2rem; min-height: 1.2rem;"></p>
        <form method="POST" action="/admin/change-password" class="form-grid" id="change-password-form">
          <div class="field">
            <label for="current-password">Current password</label>
            <div class="password-field">
              <input id="current-password" name="currentPassword" type="password" required autocomplete="current-password" />
              <button type="button" class="toggle-password" data-target="current-password" aria-label="Show password">👁</button>
            </div>
          </div>
          <div class="field">
            <label for="new-password">New password</label>
            <div class="password-field">
              <input id="new-password" name="newPassword" type="password" required autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="new-password" aria-label="Show password">👁</button>
            </div>
            <p class="password-strength" id="strength-hint" style="margin-top: 0.4rem;">Use at least 8 characters with uppercase, lowercase, a number, and a special character.</p>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <div class="password-field">
              <input id="confirm-password" name="confirmPassword" type="password" required autocomplete="new-password" />
              <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password">👁</button>
            </div>
          </div>
          <div class="form-actions" style="margin-top: 1rem;">
            <button class="btn btn-primary" type="submit">Update Password</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/password-toggle.js"></script>
  <script>
    renderSidebar('Change Password');

    const passwordParams = new URLSearchParams(location.search);
    const passwordMessage = document.getElementById('password-message');
    if (passwordParams.get('passwordChanged') === '1') {
      passwordMessage.textContent = 'Admin password updated successfully.';
      passwordMessage.className = 'text-success';
    } else if (passwordParams.get('passwordError')) {
      const err = passwordParams.get('passwordError');
      if (err === 'current') {
        passwordMessage.textContent = 'The current password is incorrect.';
      } else if (err === 'invalid') {
        passwordMessage.textContent = 'Use matching passwords with at least 8 characters, uppercase, lowercase, a number, and a special character.';
      } else {
        passwordMessage.textContent = 'Failed to update password. Please try again.';
      }
      passwordMessage.className = 'text-error';
    }

    const newPasswordInput = document.getElementById('new-password');
    const hint = document.getElementById('strength-hint');
    if (newPasswordInput && hint) {
      newPasswordInput.addEventListener('input', () => {
        const val = newPasswordInput.value;
        const strong = val.length >= 8
          && /[a-z]/.test(val)
          && /[A-Z]/.test(val)
          && /\d/.test(val)
          && /[^A-Za-z0-9]/.test(val);
        if (!val) {
          hint.textContent = 'Use at least 8 characters with uppercase, lowercase, a number, and a special character.';
          hint.className = 'password-strength';
        } else if (strong) {
          hint.textContent = 'Strong password ✓';
          hint.className = 'password-strength is-strong';
        } else {
          hint.textContent = 'Weak password: use 8+ characters with uppercase, lowercase, a number, and a special character';
          hint.className = 'password-strength is-weak';
        }
      });
    }
  </script>
</body>
</html>
