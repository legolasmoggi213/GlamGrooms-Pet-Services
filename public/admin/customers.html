<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — Glam Grooms Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <div class="flex-between">
        <div>
          <h1>Customers</h1>
          <p class="page-sub">Manage customer records and view their pets.</p>
        </div>
        <button class="btn btn-primary" id="add-btn">+ Add Customer</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Pets</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="6" class="loading">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/mobile-number.js"></script>
  <script>
    renderSidebar('Customers');

    const rowsEl = document.getElementById('rows');
    let canManageRecords = true;

    async function loadCustomers() {
      const [customers, session] = await Promise.all([
        apiGet('/customers'),
        fetch('/admin/nav-status', { credentials: 'include' }).then((response) => response.json()),
      ]);
      canManageRecords = session.role === 'ADMIN';
      document.getElementById('add-btn').hidden = !canManageRecords;
      if (!customers.length) {
        rowsEl.innerHTML = '<tr><td colspan="6" class="empty">No customers yet.</td></tr>';
        return;
      }
      rowsEl.innerHTML = customers
        .map(
          (c) => `
        <tr class="customer-row" data-customer-id="${escapeHtml(c.id)}" tabindex="0" aria-label="View details for ${escapeHtml(c.name)}">
          <td>${c.id}</td>
          <td><strong>${escapeHtml(c.name)}</strong></td>
            <td>${escapeHtml(c.email || '—')}</td>
            <td>${escapeHtml(c.phone || '—')}</td>
          <td>${(c.Pets || []).map((p) => escapeHtml(p.name)).join(', ') || '—'}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick='event.stopPropagation(); viewCustomerDetails(${escapeHtml(JSON.stringify(c.id))})'>View details</button>
            <button class="btn btn-outline btn-sm" onclick='editCustomer(${escapeHtml(JSON.stringify(c.id))})'>Edit</button>
            <button class="btn btn-danger btn-sm" onclick='removeCustomer(${escapeHtml(JSON.stringify(c.id))}, ${escapeHtml(JSON.stringify(c.name))})'>Delete</button>
          </td>
        </tr>`
        )
        .join('');
    }

    function customerBookingRows(bookings, type) {
      if (!bookings.length) return '<p class="customer-detail-empty">No bookings on record.</p>';
      return `<div class="customer-booking-list">${bookings.map((booking) => {
        const isGrooming = type === 'Grooming';
        const items = isGrooming
          ? (booking.petServices || []).map((service) => `${service.petName || 'Pet'}: ${service.service || 'Grooming'}`).join(', ') || booking.service || 'Grooming'
          : (booking.petRooms || []).map((room) => `${room.petName || 'Pet'}: ${room.roomType || 'Hotel room'}`).join(', ') || booking.roomType || 'Hotel stay';
        const schedule = isGrooming
          ? `${fmtDate(booking.date)} at ${escapeHtml(booking.time || 'Time not set')}`
          : `${fmtDate(booking.checkIn)} to ${fmtDate(booking.checkOut)}`;
        const amount = isGrooming ? booking.price : booking.totalPrice;
        return `<article class="customer-booking-item">
          <div><strong>${escapeHtml(items)}</strong><span>${schedule}</span></div>
          <div>${statusBadge(booking.status)}<strong>${fmtMoney(amount)}</strong></div>
          ${booking.notes ? `<p><strong>Special requests:</strong> ${escapeHtml(booking.notes)}</p>` : ''}
          <small>Payment: ${escapeHtml(booking.paymentStatus || 'unpaid')} · ${escapeHtml(booking.paymentMethod === 'qrph' ? 'GCash (PayMongo)' : 'Cash')}</small>
        </article>`;
      }).join('')}</div>`;
    }

    window.viewCustomerDetails = async (id) => {
      openModal('Customer details', '<div class="loading">Loading customer details…</div>');
      try {
        const customer = await apiGet(`/customers/${encodeURIComponent(id)}`);
        const pets = customer.Pets || [];
        const petDetails = pets.length
          ? `<div class="customer-pet-list">${pets.map((pet) => `<article class="customer-pet-item">
              <strong>${escapeHtml(pet.name || 'Pet')}</strong>
              <span>${escapeHtml([pet.species, pet.breed, pet.age != null ? `${pet.age} yrs` : ''].filter(Boolean).join(' · ') || 'Pet details not provided')}</span>
              <span><strong>Medical history:</strong> ${escapeHtml(pet.medicalHistory || 'None recorded')}</span>
              ${pet.notes ? `<span><strong>Notes:</strong> ${escapeHtml(pet.notes)}</span>` : ''}
            </article>`).join('')}</div>`
          : '<p class="customer-detail-empty">No pets registered.</p>';

        document.getElementById('modal-body').innerHTML = `
          <section class="customer-detail-section">
            <h4>Account information</h4>
            <dl class="customer-detail-grid">
              <div><dt>Name</dt><dd>${escapeHtml(customer.name || 'Not provided')}</dd></div>
              <div><dt>Email</dt><dd>${escapeHtml(customer.email || 'Not provided')}</dd></div>
              <div><dt>Phone</dt><dd>${escapeHtml(customer.phone || 'Not provided')}</dd></div>
              <div><dt>Address</dt><dd>${escapeHtml(customer.address || 'Not provided')}</dd></div>
              <div><dt>Customer since</dt><dd>${fmtDateTime(customer.createdAt)}</dd></div>
            </dl>
          </section>
          <section class="customer-detail-section"><h4>Pets and medical records</h4>${petDetails}</section>
          <section class="customer-detail-section"><h4>Grooming bookings</h4>${customerBookingRows(customer.GroomingAppointments || [], 'Grooming')}</section>
          <section class="customer-detail-section"><h4>Hotel bookings</h4>${customerBookingRows(customer.HotelReservations || [], 'Hotel')}</section>
          <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Close</button></div>`;
      } catch (error) {
        document.getElementById('modal-body').innerHTML = `
          <p class="text-error">Unable to load customer details: ${escapeHtml(error.message)}</p>
          <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Close</button></div>`;
      }
    };

    rowsEl.addEventListener('click', (event) => {
      if (event.target.closest('button')) return;
      const row = event.target.closest('[data-customer-id]');
      if (row) viewCustomerDetails(row.dataset.customerId);
    });
    rowsEl.addEventListener('keydown', (event) => {
      if (event.target.closest('button') || !['Enter', ' '].includes(event.key)) return;
      const row = event.target.closest('[data-customer-id]');
      if (!row) return;
      event.preventDefault();
      viewCustomerDetails(row.dataset.customerId);
    });

    function customerForm(c = {}) {
      return `
        <form id="customer-form" class="form-grid">
          <div class="field full"><label>Name *</label><input name="name" required value="${escapeHtml(c.name || '')}" /></div>
          <div class="field full"><label>Email *</label><input name="email" type="email" required value="${escapeHtml(c.email || '')}" /></div>
          <div class="field"><label>Phone *</label><input name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" data-mobile-number pattern="[0-9]{11}" title="Enter exactly 11 digits." required value="${escapeHtml(c.phone || '')}" /></div>
          <div class="field"><label>Address</label><input name="address" value="${escapeHtml(c.address || '')}" /></div>
          <div class="form-actions full">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          </div>
        </form>`;
    }

    function bindForm(id) {
      document.getElementById('customer-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = e.target;
        const body = {
          name: f.name.value.trim(),
          email: f.email.value.trim(),
          phone: f.phone.value.trim(),
          address: f.address.value.trim() || null,
        };
        try {
          if (id) await apiPut(`/customers/${id}`, body);
          else await apiPost('/customers', body);
          closeModal();
          loadCustomers();
        } catch (error) {
          alert(error.message);
        }
      });
    }

    document.getElementById('add-btn').addEventListener('click', () => {
      openModal('Add Customer', customerForm());
      bindForm(null);
    });

    window.editCustomer = async (id) => {
      const c = await apiGet(`/customers/${id}`);
      openModal('Edit Customer', customerForm(c));
      bindForm(id);
    };

    window.removeCustomer = (id, name) =>
      confirmDelete(`Delete customer "${name}" and all their pets/bookings?`, async () => {
        try {
          await apiDelete(`/customers/${id}`);
          loadCustomers();
        } catch (error) {
          alert(error.message);
        }
      });

    loadCustomers().catch((e) => {
      rowsEl.innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`;
    });
  </script>
</body>
</html>
