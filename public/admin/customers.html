<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — Glam Grooms Admin</title>
  <link rel="stylesheet" href="/css/style.css?v=admin-modern-20261027" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <div class="flex-between">
        <div>
          <h1>Customers</h1>
          <p class="page-sub">Manage customer records and view their pets.</p>
        </div>
        <button class="btn btn-primary" id="add-btn">+ Add Customer</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Pets</th><th>Created</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="7" class="loading">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/mobile-number.js"></script>
  <script>
    renderSidebar('Customers');

    const rowsEl = document.getElementById('rows');
    let canManageRecords = true;

    async function loadCustomers() {
      const [customers, session] = await Promise.all([
        apiGet('/customers'),
        fetch('/admin/nav-status', { credentials: 'include' }).then((response) => response.json()),
      ]);
      canManageRecords = session.role === 'ADMIN';
      document.getElementById('add-btn').hidden = !canManageRecords;
      if (!customers.length) {
        rowsEl.innerHTML = '<tr><td colspan="7" class="empty">No customers yet.</td></tr>';
        return;
      }
      rowsEl.innerHTML = sortByNewestDate(customers, 'createdAt')
        .map(
          (c) => `
        <tr>
            <td><button class="record-id" type="button" onclick='viewCustomer(${escapeHtml(JSON.stringify(c.id))})' aria-label="View customer ${escapeHtml(c.id)}">${escapeHtml(c.id)}</button></td>
          <td><strong>${escapeHtml(c.name)}</strong></td>
            <td>${escapeHtml(c.email || '—')}</td>
            <td>${escapeHtml(c.phone || '—')}</td>
          <td>${(c.Pets || []).map((p) => escapeHtml(p.name)).join(', ') || '—'}</td>
            <td>${escapeHtml(fmtDateTime(c.createdAt))}</td>
          <td>
              ${canManageRecords ? `<button class="btn btn-outline btn-sm" onclick='editCustomer(${escapeHtml(JSON.stringify(c.id))})'>Edit</button>
              <button class="btn btn-danger btn-sm" onclick='removeCustomer(${escapeHtml(JSON.stringify(c.id))}, ${escapeHtml(JSON.stringify(c.name))})'>Delete</button>` : '<span class="text-muted">Read-only</span>'}
          </td>
        </tr>`
        )
        .join('');
    }

    window.viewCustomer = async (id) => {
      const c = await apiGet(`/customers/${id}`);
      const pets = (c.Pets || []).map((pet) => `${pet.name || 'Pet'} — ${pet.species || 'Species not set'}, ${pet.breed || 'Breed not set'} (ID: ${pet.id})`).join('\n') || 'No pets registered.';
      const bookingSummary = (bookings, type) => (bookings || []).map((booking) => {
          const schedule = type === 'Grooming'
            ? `${fmtDate(booking.date)} at ${booking.time || 'Time TBA'}`
            : `${fmtDate(booking.checkIn)} to ${fmtDate(booking.checkOut)}`;
          return `${booking.id} — ${schedule} — ${booking.status || 'unknown'} — ${booking.paymentStatus || 'payment status unknown'}`;
      }).join('\n') || `No ${type.toLowerCase()} bookings.`;
      openModal('Customer Details', `
          <div class="form-grid">
            <div class="field"><label>Customer ID</label><input type="text" readonly value="${escapeHtml(c.id)}" /></div>
            <div class="field"><label>Name</label><input type="text" readonly value="${escapeHtml(c.name || '—')}" /></div>
            <div class="field"><label>Email</label><input type="text" readonly value="${escapeHtml(c.email || '—')}" /></div>
            <div class="field"><label>Phone</label><input type="text" readonly value="${escapeHtml(c.phone || '—')}" /></div>
            <div class="field full"><label>Address</label><textarea rows="2" readonly>${escapeHtml(c.address || '—')}</textarea></div>
            <div class="field"><label>Created At</label><input type="text" readonly value="${escapeHtml(c.createdAt ? fmtDateTime(c.createdAt) : '—')}" /></div>
            <div class="field"><label>Updated At</label><input type="text" readonly value="${escapeHtml(c.updatedAt ? fmtDateTime(c.updatedAt) : '—')}" /></div>
            <div class="field full"><label>Pets</label><textarea rows="${Math.max(2, (c.Pets || []).length)}" readonly>${escapeHtml(pets)}</textarea></div>
            <div class="field full"><label>Grooming Bookings</label><textarea rows="${Math.max(2, (c.GroomingAppointments || []).length)}" readonly>${escapeHtml(bookingSummary(c.GroomingAppointments, 'Grooming'))}</textarea></div>
            <div class="field full"><label>Hotel Reservations</label><textarea rows="${Math.max(2, (c.HotelReservations || []).length)}" readonly>${escapeHtml(bookingSummary(c.HotelReservations, 'Hotel'))}</textarea></div>
          </div>
      `);
    };

    function customerForm(c = {}) {
      return `
        <form id="customer-form" class="form-grid">
          <div class="field full"><label>Name *</label><input name="name" required value="${escapeHtml(c.name || '')}" /></div>
          <div class="field full"><label>Email *</label><input name="email" type="email" required value="${escapeHtml(c.email || '')}" /></div>
          <div class="field"><label>Phone *</label><input name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" data-mobile-number pattern="[0-9]{11}" title="Enter exactly 11 digits." required value="${escapeHtml(c.phone || '')}" /></div>
          <div class="field"><label>Address</label><input name="address" value="${escapeHtml(c.address || '')}" /></div>
          <div class="form-actions full">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          </div>
        </form>`;
    }

    function bindForm(id) {
      document.getElementById('customer-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = e.target;
        const body = {
          name: f.name.value.trim(),
          email: f.email.value.trim(),
          phone: f.phone.value.trim(),
          address: f.address.value.trim() || null,
        };
        try {
          if (id) await apiPut(`/customers/${id}`, body);
          else await apiPost('/customers', body);
          closeModal();
          loadCustomers();
        } catch (error) {
          alert(error.message);
        }
      });
    }

    document.getElementById('add-btn').addEventListener('click', () => {
      openModal('Add Customer', customerForm());
      bindForm(null);
    });

    window.editCustomer = async (id) => {
      const c = await apiGet(`/customers/${id}`);
      openModal('Edit Customer', customerForm(c));
      bindForm(id);
    };

    window.removeCustomer = (id, name) =>
      confirmDelete(`Delete customer "${name}" and all their pets/bookings?`, async () => {
        try {
          await apiDelete(`/customers/${id}`);
          loadCustomers();
        } catch (error) {
          alert(error.message);
        }
      });

    loadCustomers().catch((e) => {
      rowsEl.innerHTML = `<tr><td colspan="7" class="empty">${escapeHtml(e.message)}</td></tr>`;
    });
  </script>
</body>
</html>
