<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Reservations — Glam Grooms Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <div class="flex-between">
        <div>
          <h1>Hotel Reservations</h1>
          <p class="page-sub">Manage pet hotel stays and check-ins.</p>
        </div>
        <button class="btn btn-primary" id="add-btn">+ New Reservation</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Check-in</th><th>Check-out</th><th>Room</th><th>Pet</th><th>Customer</th><th>Total</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="9" class="loading">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    renderSidebar('Hotel');

    const rowsEl = document.getElementById('rows');
    let customersCache = [];
    let petsCache = [];

    const ROOMS = ['standard', 'deluxe', 'suite'];
    const STATUSES = ['pending', 'reserved', 'confirmed', 'checked-in', 'checked-out', 'cancelled'];

    async function loadReservations() {
      const items = await apiGet('/hotel');
      if (!items.length) {
        rowsEl.innerHTML = '<tr><td colspan="9" class="empty">No reservations yet.</td></tr>';
        return;
      }
      rowsEl.innerHTML = items
        .map(
          (r) => `
        <tr>
          <td>${r.id}</td>
          <td>${fmtDate(r.checkIn)}</td>
          <td>${fmtDate(r.checkOut)}</td>
          <td>${capitalize(r.roomType)}</td>
          <td>${r.Pet ? escapeHtml(r.Pet.name) : '—'}</td>
          <td>${r.Customer ? escapeHtml(r.Customer.name) : '—'}</td>
          <td>${fmtMoney(r.totalPrice)}</td>
          <td>${statusBadge(r.status)}</td>
          <td>
            ${r.status !== 'confirmed' && r.status !== 'checked-in' && r.status !== 'checked-out' && r.status !== 'cancelled' ? `<button class="btn btn-success btn-sm" onclick="confirmRes('${r.id}', this)">Confirm</button>` : ''}
            <button class="btn btn-outline btn-sm" onclick='viewRes(${escapeHtml(JSON.stringify(r.id))})'>View</button>
            <button class="btn btn-danger btn-sm" onclick='removeRes(${escapeHtml(JSON.stringify(r.id))})'>Delete</button>
          </td>
        </tr>`
        )
        .join('');
    }

    function resForm(r = {}) {
      const roomOptions = ROOMS.map((s) => `<option value="${s}" ${r.roomType === s ? 'selected' : ''}>${capitalize(s)}</option>`).join('');
      const statusOptions = STATUSES.map((s) => `<option value="${s}" ${r.status === s ? 'selected' : ''}>${capitalize(s)}</option>`).join('');
      const customerOptions = customersCache.map((c) => `<option value="${escapeHtml(c.id)}" ${String(r.customerId) === String(c.id) ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
      const petOptions = petsCache.map((p) => `<option value="${escapeHtml(p.id)}" data-customer="${escapeHtml(p.customerId)}" ${String(r.petId) === String(p.id) ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
      return `
        <form id="res-form" class="form-grid">
          <div class="field"><label>Customer *</label><select name="customerId" required>${customerOptions}</select></div>
          <div class="field"><label>Pet *</label><select name="petId" required>${petOptions}</select></div>
          <div class="field"><label>Room Type *</label><select name="roomType">${roomOptions}</select></div>
          <div class="field"><label>Status</label><select name="status">${statusOptions}</select></div>
          <div class="field"><label>Check-in *</label><input name="checkIn" type="date" required value="${r.checkIn || ''}" /></div>
          <div class="field"><label>Check-in time *</label><input name="checkInTime" type="time" required value="${r.checkInTime || '14:00'}" /></div>
          <div class="field"><label>Check-out *</label><input name="checkOut" type="date" required value="${r.checkOut || ''}" /></div>
          <div class="field"><label>Check-out time *</label><input name="checkOutTime" type="time" required value="${r.checkOutTime || '12:00'}" /></div>
          <div class="field full"><label>Notes</label><textarea name="notes" rows="2">${escapeHtml(r.notes || '')}</textarea></div>
          <div class="form-actions full">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          </div>
        </form>`;
    }

    function bindForm(id) {
      const form = document.getElementById('res-form');
      const customerSelect = form.customerId;
      const petSelect = form.petId;
      const filterPets = () => {
        const cid = customerSelect.value;
        let firstValid = null;
        [...petSelect.options].forEach((opt) => {
          const match = opt.dataset.customer === cid;
          opt.hidden = !match;
          if (match && !firstValid) firstValid = opt;
        });
        if (petSelect.selectedOptions[0] && petSelect.selectedOptions[0].hidden && firstValid) {
          petSelect.value = firstValid.value;
        }
      };
      customerSelect.addEventListener('change', filterPets);
      filterPets();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
          customerId: form.customerId.value,
          petId: form.petId.value,
          roomType: form.roomType.value,
          status: form.status.value,
          checkIn: form.checkIn.value,
          checkInTime: form.checkInTime.value,
          checkOut: form.checkOut.value,
          checkOutTime: form.checkOutTime.value,
          notes: form.notes.value.trim() || null,
        };
        try {
          if (id) await apiPut(`/hotel/${id}`, body);
          else await apiPost('/hotel', body);
          closeModal();
          loadReservations();
        } catch (error) {
          alert(error.message);
        }
      });
    }

    document.getElementById('add-btn').addEventListener('click', () => {
      if (!customersCache.length || !petsCache.length) {
        alert('Add at least one customer and pet first.');
        return;
      }
      openModal('New Reservation', resForm({ customerId: customersCache[0].id, petId: petsCache[0].id, status: 'pending' }));
      bindForm(null);
    });

    window.viewRes = async (id) => {
      const r = await apiGet(`/hotel/${id}`);
      const pet = r.Pet ? escapeHtml(r.Pet.name) : '—';
      const customer = r.Customer ? escapeHtml(r.Customer.name) : '—';
      const petInfo = r.Pet ? `Species: ${escapeHtml(r.Pet.species || '—')}, Breed: ${escapeHtml(r.Pet.breed || '—')}, Age: ${r.Pet.age != null ? r.Pet.age : '—'}` : '';
      const customerInfo = r.Customer ? `Email: ${escapeHtml(r.Customer.email || '—')}, Phone: ${escapeHtml(r.Customer.phone || '—')}` : '';
      openModal('Reservation Details', `
        <div class="form-grid">
          <div class="field"><label>Reservation ID</label><input type="text" readonly value="${escapeHtml(r.id)}" /></div>
          <div class="field"><label>Customer</label><input type="text" readonly value="${customer}" /></div>
          <div class="field"><label>Pet</label><input type="text" readonly value="${pet}" /></div>
          <div class="field"><label>Room Type</label><input type="text" readonly value="${escapeHtml(r.roomType)}" /></div>
          <div class="field"><label>Check-in</label><input type="text" readonly value="${escapeHtml(r.checkIn)}" /></div>
          <div class="field"><label>Check-in Time</label><input type="text" readonly value="${escapeHtml(r.checkInTime || '—')}" /></div>
          <div class="field"><label>Check-out</label><input type="text" readonly value="${escapeHtml(r.checkOut)}" /></div>
          <div class="field"><label>Check-out Time</label><input type="text" readonly value="${escapeHtml(r.checkOutTime || '—')}" /></div>
          <div class="field"><label>Total</label><input type="text" readonly value="${fmtMoney(r.totalPrice)}" /></div>
          <div class="field"><label>Status</label><input type="text" readonly value="${escapeHtml(r.status)}" /></div>
          <div class="field full"><label>Pet Details</label><textarea rows="2" readonly>${petInfo || '—'}</textarea></div>
          <div class="field full"><label>Customer Details</label><textarea rows="2" readonly>${customerInfo || '—'}</textarea></div>
          <div class="field full"><label>Customer Notes</label><textarea rows="3" readonly>${escapeHtml(r.notes || 'No notes.')}</textarea></div>
        </div>
      `);
    };

    window.confirmRes = async (id, button) => {
      if (button) {
        button.disabled = true;
        button.textContent = 'Confirming...';
      }
      try {
        const result = await apiPut(`/hotel/${id}`, { status: 'confirmed' });
        if (!result.emailSent) alert('Booking confirmed, but the customer email was not sent. Check SMTP settings in .env.');
        await loadReservations();
      } catch (error) {
        if (button) {
          button.disabled = false;
          button.textContent = 'Confirm';
        }
        alert(error.message);
      }
    };

    window.removeRes = (id) =>
      confirmDelete('Delete this reservation?', async () => {
        try {
          await apiDelete(`/hotel/${id}`);
          loadReservations();
        } catch (error) {
          alert(error.message);
        }
      });

    (async () => {
      try {
        [customersCache, petsCache] = await Promise.all([apiGet('/customers'), apiGet('/pets')]);
        await loadReservations();
      } catch (e) {
        rowsEl.innerHTML = `<tr><td colspan="9" class="empty">${escapeHtml(e.message)}</td></tr>`;
      }
    })();
  </script>
</body>
</html>
