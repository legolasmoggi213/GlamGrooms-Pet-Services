<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Glam Grooms</title>
  <link rel="stylesheet" href="/css/style.css?v=responsive-global-20261028b" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/index.html">Glam Grooms Pet Spa & Hotel</a>
  </header>

  <div class="customer-login-card">
    <h2>Admin / Staff Login</h2>
    <p id="login-message" class="text-error" aria-live="polite" hidden></p>
    <form id="credentials-form" method="POST" action="/admin/login">
      <div class="field">
        <label for="username">Admin email or staff username</label>
        <input id="username" name="username" type="text" placeholder="Enter your admin email or staff username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="field login-actions">
        <button class="btn btn-primary" type="submit">Continue</button>
        <a href="/customer/login.html" style="margin-left:1rem;">← Back to customer login</a>
      </div>
    </form>
    <form id="verification-form" method="POST" action="/admin/login/verify-code" hidden>
      <p class="text-muted">A 6-digit sign-in code was sent to the email address on the account. Enter it to continue.</p>
      <div class="field">
        <label for="verification-code">Verification code</label>
        <input id="verification-code" name="verificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
      </div>
      <div class="field login-actions">
        <button class="btn btn-primary" type="submit">Verify and sign in</button>
        <a href="/admin/login.html">Back</a>
      </div>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const verifying = params.get('verify') === '1';
    document.getElementById('credentials-form').hidden = verifying;
    document.getElementById('verification-form').hidden = !verifying;
    const message = document.getElementById('login-message');
    const messages = {
      '1': 'Username or password is incorrect.',
      email: 'Could not send a code. Check that the account email is a Gmail address and email delivery is configured.',
      wait: 'A code was sent recently. Wait one minute before trying again.',
      code: 'The code is incorrect or expired. You may try again or return to sign in.',
      limit: 'Too many incorrect codes. Return to sign in and request a new code.',
      expired: 'The verification session expired. Sign in again to request a new code.',
      server: 'Unable to verify the code right now. Please try again.',
    };
    const error = params.get('error');
    if (error && messages[error]) {
      message.textContent = messages[error];
      message.hidden = false;
    }
    if (verifying) document.getElementById('verification-code').focus();
  </script>
</body>
</html>
