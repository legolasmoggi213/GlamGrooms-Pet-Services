<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Glam Grooms</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/index.html">Glam Grooms Pet Spa & Hotel</a>
  </header>

  <div class="customer-login-card">
    <h2>Admin Login</h2>
    <p id="admin-login-message" class="text-error" hidden>Use the ADMIN credentials or your staff email and password.</p>
    <form method="POST" action="/admin/login">
      <div class="field">
        <label for="username">Admin username or staff email</label>
        <input id="username" name="username" type="text" placeholder="Enter ADMIN or your staff email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="field login-actions">
        <button class="btn btn-primary" type="submit">Continue</button>
        <a href="/customer/login.html" style="margin-left:1rem;">← Back to customer login</a>
      </div>
    </form>
    <form id="verification-form" method="POST" action="/admin/login/verify-code" hidden>
      <p class="text-muted">A 6-digit sign-in code was sent to the Gmail address on the staff account. Enter it to continue.</p>
      <div class="field">
        <label for="verification-code">Verification code</label>
        <input id="verification-code" name="verificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
      </div>
      <div class="field login-actions">
        <button class="btn btn-primary" type="submit">Verify and sign in</button>
        <a href="/admin/login.html">Back</a>
      </div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const message = document.getElementById('admin-login-message');
    if (params.get('error') === '1') {
      message.hidden = false;
      message.textContent = 'Invalid username or password. Use ADMIN credentials or your staff account.';
    }
  </script>

</body>
</html>
