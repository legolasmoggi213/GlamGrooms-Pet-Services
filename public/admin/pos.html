<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Point of Sale — Glam Grooms Admin</title>
  <link rel="stylesheet" href="/css/style.css?v=admin-modern-20261027" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <div class="flex-between">
        <div>
          <h1>Point of Sale</h1>
          <p class="page-sub">Counter checkout</p>
        </div>
      </div>

      <div class="pos-layout">
        <section class="panel pos-workspace" aria-label="Sale items">
          <div class="pos-categories" role="group" aria-label="Sale category">
            <button type="button" data-category="all" aria-pressed="true">All</button>
            <button type="button" data-category="grooming" aria-pressed="false">Grooming</button>
            <button type="button" data-category="ayurveda" aria-pressed="false">Ayurveda</button>
            <button type="button" data-category="hotel" aria-pressed="false">Hotel</button>
            <button type="button" data-category="products" aria-pressed="false">Products</button>
          </div>
          <div id="pos-products" class="pos-products"><div class="loading">Loading services…</div></div>
        </section>

        <section class="panel pos-cart" aria-label="Current sale">
          <div class="flex-between">
            <h3>Current sale</h3>
            <button type="button" id="clear-cart" class="btn btn-outline btn-sm">Clear</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr></thead>
              <tbody id="cart-rows"><tr><td colspan="4" class="empty">No items in this sale.</td></tr></tbody>
            </table>
          </div>

          <form id="pos-checkout" class="pos-checkout">
            <div class="field">
              <label for="sale-customer">Customer</label>
              <input id="sale-customer" maxlength="120" value="Walk-in customer" />
            </div>
            <div class="field">
              <label for="sale-contact">Contact</label>
              <input id="sale-contact" type="tel" inputmode="numeric" autocomplete="tel-national" data-mobile-number pattern="[0-9]{11}" title="Leave blank or enter exactly 11 digits." placeholder="Optional" />
            </div>
            <div class="field" id="sale-pet-field" hidden>
              <label for="sale-pet">Pet name</label>
              <input id="sale-pet" maxlength="120" />
            </div>
            <div class="field">
              <span class="field-label">Payment method</span>
              <div class="pos-tender-options">
                <label><input type="radio" name="paymentMethod" value="cash" checked /><span>Cash</span></label>
                <label><input type="radio" name="paymentMethod" value="qrph" /><span>QR</span></label>
              </div>
            </div>
            <div id="cash-received-field" class="field">
              <label for="cash-received">Cash received (PHP)</label>
              <input id="cash-received" type="number" min="0.01" max="10000000" step="0.01" placeholder="Enter amount" />
              <div id="change-preview" class="pos-change" aria-live="polite"></div>
            </div>
            <div class="pos-total"><span>Total due</span><strong id="cart-total">₱0.00</strong></div>
            <button id="complete-sale" class="btn btn-primary" type="submit" disabled>Complete sale</button>
            <div id="pos-message" class="alert" role="status" aria-live="polite" hidden></div>
          </form>
        </section>
      </div>

      <section class="panel pos-sales-panel" aria-label="Walk-in sales overview">
        <div class="flex-between pos-sales-heading">
          <div><h3>Walk-in sales</h3><p class="text-muted">Sales from every completed POS transaction</p></div>
          <label class="field"><span>Graph period</span><select id="pos-sales-period"><option value="daily">Daily · 7 days</option><option value="weekly">Weekly · 8 weeks</option><option value="monthly">Monthly · 6 months</option></select></label>
        </div>
        <div class="pos-sales-summary">
          <div><span>All-time sales</span><strong id="pos-sales-all-time">PHP 0.00</strong></div>
          <div><span>All-time transactions</span><strong id="pos-sales-transaction-count">0</strong></div>
        </div>
        <div id="pos-sales-chart" class="pos-sales-chart" role="img" aria-label="Walk-in sales chart"><div class="loading">Loading sales…</div></div>
        <p id="pos-sales-message" class="text-muted" role="status" aria-live="polite" hidden></p>
      </section>

      <section id="pos-receipt" class="pos-receipt" aria-live="polite"></section>
      <section class="panel" aria-label="Recent receipts">
        <div class="flex-between">
          <h3>Saved receipts</h3>
        </div>
        <div id="saved-receipts" class="saved-receipts"><div class="empty">No saved receipts yet.</div></div>
      </section>
    </main>
  </div>

  <script src="/js/mobile-number.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    renderSidebar('Point of Sale');

    const productContainer = document.getElementById('pos-products');
    const cartRows = document.getElementById('cart-rows');
    const cartTotal = document.getElementById('cart-total');
    const checkoutButton = document.getElementById('complete-sale');
    const cashReceived = document.getElementById('cash-received');
    const cashField = document.getElementById('cash-received-field');
    const petField = document.getElementById('sale-pet-field');
    const petNameInput = document.getElementById('sale-pet');
    const salesPeriod = document.getElementById('pos-sales-period');
    const salesChart = document.getElementById('pos-sales-chart');
    const salesMessage = document.getElementById('pos-sales-message');
    const cart = [];
    let catalog = [];
    let categoryFilter = 'all';
    let salesRequest = 0;

    const money = (value) => fmtMoney(value);
    const receiptMoney = (value) => `PHP ${Number(value || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const saleTotal = () => Math.round(cart.reduce((total, item) => total + item.unitPrice * item.quantity, 0) * 100) / 100;

    const displayName = (service) => service.name
      .replace(/^grooming-/, '')
      .replace(/^ayurveda-(herb|pkg)-/, '')
      .replace(/^(day-care|staycation)-/, '')
      .replace(/-/g, ' ')
      .replace(/\b\w/g, (letter) => letter.toUpperCase());

    const productDescription = (product) => {
      if (product.kind === 'hotel') {
        return product.description || (product.amenities.length
          ? `${product.occupancy ? `Fits up to ${product.occupancy} pets. ` : ''}${product.amenities.join(' · ')}.`
          : 'Overnight accommodation for your pet.');
      }
      if (product.kind === 'product') {
        return product.description || `${product.category || 'Retail item'} available for walk-in purchase.`;
      }
      if (product.kind === 'ayurveda') {
        return 'Ayurveda-inspired grooming and wellness treatment; included care is listed below.';
      }
      return `${product.category} grooming service for walk-in customers; service inclusions are listed below.`;
    };

    function renderProducts() {
      const visible = catalog.filter((product) => {
        const matchesCategory = categoryFilter === 'all'
          || (categoryFilter === 'products' ? product.kind === 'product' : product.kind === categoryFilter);
        return matchesCategory;
      });
      productContainer.innerHTML = visible.length ? visible.map((product) => `
        <button type="button" class="pos-product pos-product-${escapeHtml(product.kind)}" data-product-id="${escapeHtml(product.id)}" ${product.kind === 'product' && (!product.price || product.quantity < 1) ? 'disabled' : ''}>
          <span class="pos-product-category">${escapeHtml(product.category || capitalize(product.kind))}</span>
          <strong>${escapeHtml(product.label)}</strong>
          <span class="pos-product-description">${escapeHtml(productDescription(product))}</span>
          ${product.details.length ? `<span class="pos-product-details">${product.details.slice(0, 3).map((detail) => `<span>${escapeHtml(detail)}</span>`).join('')}</span>` : ''}
          <span class="pos-product-footer">
            <span>${product.kind === 'product' ? `${Number(product.quantity || 0).toLocaleString('en-PH')} ${escapeHtml(product.unit || 'unit(s)')} in stock` : product.kind === 'hotel' ? `Weekday ${money(product.weekdayRate)} · Weekend ${money(product.weekendRate)} / ${escapeHtml(product.unit || 'night')}` : product.duration ? `About ${product.duration} min` : 'Price per service'}</span>
            <strong>${product.kind === 'product' && product.quantity < 1 ? 'Out of stock' : product.price ? `${money(product.price)}${product.unit ? ` / ${escapeHtml(product.unit)}` : ''}` : 'Set price in Inventory'}</strong>
          </span>
        </button>`).join('') : '<div class="empty">No matching services.</div>';
    }

    function renderCart() {
      if (!cart.length) {
        cartRows.innerHTML = '<tr><td colspan="4" class="empty">No items in this sale.</td></tr>';
      } else {
        cartRows.innerHTML = cart.map((item, index) => `
          <tr>
            <td class="pos-item-name">${escapeHtml(item.name)}<br><span class="text-muted">${money(item.unitPrice)}${item.unit ? ` / ${escapeHtml(item.unit)}` : ' each'}</span></td>
            <td><span class="pos-quantity">
              <button type="button" data-cart-action="decrease" data-index="${index}" aria-label="Decrease quantity">−</button>
              <span>${item.quantity}</span>
              <button type="button" data-cart-action="increase" data-index="${index}" aria-label="Increase quantity">+</button>
            </span></td>
            <td>${money(item.unitPrice * item.quantity)}</td>
            <td><button type="button" class="pos-remove" data-cart-action="remove" data-index="${index}" aria-label="Remove item">×</button></td>
          </tr>`).join('');
      }
      cartTotal.textContent = money(saleTotal());
      checkoutButton.disabled = !cart.length;
      const includesHotel = cart.some((item) => item.kind === 'hotel');
      petField.hidden = !includesHotel;
      petNameInput.required = includesHotel;
      if (!includesHotel) petNameInput.value = '';
      updateTender();
    }

    function addItem(item) {
      const existing = cart.find((line) => line.name === item.name && line.unitPrice === item.unitPrice && line.inventoryId === item.inventoryId);
      if (existing && item.inventoryId && existing.quantity >= item.stockQuantity) {
        showMessage(`Only ${item.stockQuantity} ${item.unit || 'unit(s)'} of this product are in stock.`, 'error');
        return;
      }
      if (existing) existing.quantity += 1;
      else cart.push({ ...item, quantity: 1 });
      renderCart();
    }

    function updateTender() {
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const isCash = paymentMethod === 'cash';
      cashField.hidden = !isCash;
      cashReceived.required = isCash && cart.length > 0;
      const received = Number(cashReceived.value);
      const change = Math.round((received - saleTotal()) * 100) / 100;
      document.getElementById('change-preview').textContent = isCash && received >= saleTotal() && saleTotal() > 0
        ? `Change: ${money(change)}`
        : '';
      if (!isCash) {
        cashReceived.value = '';
      }
    }

    function showMessage(text, kind) {
      const message = document.getElementById('pos-message');
      message.textContent = text;
      message.className = `alert alert-${kind} show`;
      message.hidden = false;
    }

    async function loadSalesAnalytics() {
      const requestId = ++salesRequest;
      salesMessage.hidden = true;
      try {
        const result = await apiGet(`/admin/pos-sales?period=${encodeURIComponent(salesPeriod.value)}`);
        if (requestId !== salesRequest) return;
        document.getElementById('pos-sales-all-time').textContent = receiptMoney(result.allTimeSales);
        document.getElementById('pos-sales-transaction-count').textContent = Number(result.allTimeTransactions || 0).toLocaleString('en-PH');
        const buckets = Array.isArray(result.buckets) ? result.buckets : [];
        const maximum = Math.max(0, ...buckets.map((bucket) => Number(bucket.sales || 0)));
        salesChart.innerHTML = buckets.length ? buckets.map((bucket) => {
          const sales = Number(bucket.sales || 0);
          const height = maximum ? Math.max(sales ? 3 : 0, sales / maximum * 100) : 0;
          return `<div class="pos-sales-column" title="${escapeHtml(`${bucket.label}: ${receiptMoney(sales)}, ${bucket.count} sales`)}">
            <strong>${sales ? receiptMoney(sales) : '—'}</strong>
            <div class="pos-sales-track"><span style="height:${height}%"></span></div>
            <span class="pos-sales-label">${escapeHtml(bucket.label)}</span>
            <small>${Number(bucket.count || 0).toLocaleString('en-PH')} sales</small>
          </div>`;
        }).join('') : '<div class="empty">No walk-in sales in this period.</div>';
      } catch (error) {
        if (requestId !== salesRequest) return;
        salesChart.innerHTML = '<div class="empty">Unable to load POS sales.</div>';
        salesMessage.textContent = error.message || 'Unable to load POS sales.';
        salesMessage.hidden = false;
      }
    }

    function renderReceipt(transaction, sale, paymentMethod, tenderedAmount, customerName) {
      const receipt = document.getElementById('pos-receipt');
      const savedReceipt = transaction?.receipt || {};
      const receiptNumber = savedReceipt.receiptNumber || transaction?.id || 'POS-000';
      const receiptPetName = savedReceipt.petName || transaction?.petName;
      const receiptItems = Array.isArray(savedReceipt.items) && savedReceipt.items.length
        ? savedReceipt.items
        : (sale.length ? sale : []);
      const total = Number(savedReceipt.amount ?? transaction?.amount ?? receiptItems.reduce((sum, item) => sum + Number(item.lineTotal ?? Number(item.unitPrice || 0) * Number(item.quantity || 1)), 0));
      const received = Number(savedReceipt.tenderedAmount ?? transaction?.tenderedAmount ?? tenderedAmount ?? total);
      const changeDue = Number(savedReceipt.changeDue ?? transaction?.changeDue ?? Math.max(0, received - total));
      const paidAt = savedReceipt.paidAt || transaction?.paidAt || new Date().toISOString();
      const method = paymentMethod || savedReceipt.paymentMethod || 'cash';
      const lines = receiptItems.map((item) => {
        const itemName = item.name || item.label || 'Item';
        const quantity = Number(item.quantity || 1);
        const unitPrice = Number(item.unitPrice || 0);
        const lineTotal = Number(item.lineTotal ?? quantity * unitPrice);
        return `<tr><td>${escapeHtml(itemName)}${item.category ? `<span class="receipt-item-note">${escapeHtml(item.category)}</span>` : ''}</td><td>${quantity}</td><td>${receiptMoney(unitPrice || lineTotal)}</td><td>${receiptMoney(lineTotal)}</td></tr>`;
      }).join('');
      receipt.innerHTML = `
        <article class="receipt-document">
          <header class="receipt-brand">
            <div class="receipt-brand-mark" aria-hidden="true">GG</div>
            <div><h1>Glam Grooms</h1><p>Pet Spa &amp; Hotel</p></div>
            <span class="receipt-status">PAID</span>
          </header>
          <div class="receipt-title"><h2>Sales receipt</h2><p>Thank you for choosing Glam Grooms.</p></div>
          <dl class="receipt-meta-grid">
            <div><dt>Receipt no.</dt><dd>${escapeHtml(String(receiptNumber))}</dd></div>
            <div><dt>Date &amp; time</dt><dd>${escapeHtml(fmtDateTime(paidAt))}</dd></div>
            <div><dt>Customer</dt><dd>${escapeHtml(customerName || savedReceipt.customerName || 'Walk-in customer')}</dd></div>
            ${receiptPetName ? `<div><dt>Pet</dt><dd>${escapeHtml(receiptPetName)}</dd></div>` : ''}
            <div><dt>Contact</dt><dd>${escapeHtml(savedReceipt.contact || '—')}</dd></div>
            <div><dt>Payment method</dt><dd>${escapeHtml(capitalize(method))}</dd></div>
            <div><dt>Transaction ID</dt><dd>${escapeHtml(String(transaction?.id || receiptNumber))}</dd></div>
          </dl>
          <table class="receipt-items">
            <thead><tr><th>Service / product</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead>
            <tbody>${lines || '<tr><td colspan="4">No item details available.</td></tr>'}</tbody>
          </table>
          <div class="receipt-total"><span>Total paid</span><strong>${receiptMoney(total)}</strong></div>
          ${String(method).toLowerCase() === 'cash' ? `<dl class="receipt-payment-summary"><div><dt>Cash received</dt><dd>${receiptMoney(received)}</dd></div><div><dt>Change</dt><dd>${receiptMoney(changeDue)}</dd></div></dl>` : ''}
          <footer class="receipt-footer"><strong>Thank you for trusting us with your pet’s care.</strong><span>Glam Grooms Pet Spa &amp; Hotel</span></footer>
        </article>
        <div class="receipt-actions"><button type="button" class="btn btn-primary" onclick="window.print()">Print receipt</button></div>`;
      receipt.classList.add('is-visible');
      receipt.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderSavedReceipts(records) {
      const container = document.getElementById('saved-receipts');
      if (!records.length) {
        container.innerHTML = '<div class="empty">No saved receipts yet.</div>';
        return;
      }
      container.innerHTML = records.map((record) => {
        const receipt = record.receipt || {
          receiptNumber: record.id,
          customerName: record.customerName || 'Walk-in customer',
          petName: record.petName || null,
          paymentMethod: record.paymentMethod || 'cash',
          amount: Number(record.amount || 0),
          tenderedAmount: Number(record.tenderedAmount || record.amount || 0),
          changeDue: Number(record.changeDue || 0),
          items: Array.isArray(record.items) ? record.items : [],
          paidAt: record.paidAt || record.createdAt,
        };
        return `
          <div class="saved-receipt-item">
            <div>
              <strong>Receipt #${escapeHtml(String(receipt.receiptNumber || record.id))}</strong><br>
              <span>${escapeHtml(receipt.customerName || record.customerName || 'Walk-in customer')}${receipt.petName || record.petName ? ` · ${escapeHtml(receipt.petName || record.petName)}` : ''} · ${escapeHtml(capitalize(receipt.paymentMethod || record.paymentMethod || 'cash'))}</span><br>
              <small>${escapeHtml(fmtDateTime(receipt.paidAt || record.paidAt || new Date().toISOString()))}</small>
            </div>
            <button type="button" class="btn btn-outline btn-sm" data-print-receipt="${escapeHtml(String(record.id))}">Print</button>
          </div>`;
      }).join('');
      container.querySelectorAll('[data-print-receipt]').forEach((button) => {
        button.addEventListener('click', async () => {
          const recordId = button.dataset.printReceipt;
          const record = (await apiGet('/admin/cash-transactions')).find((item) => String(item.id) === String(recordId));
          if (!record) return;
          const receiptData = record.receipt || {
            receiptNumber: record.id,
            customerName: record.customerName || 'Walk-in customer',
            petName: record.petName || null,
            paymentMethod: record.paymentMethod || 'cash',
            amount: Number(record.amount || 0),
            tenderedAmount: Number(record.tenderedAmount || record.amount || 0),
            changeDue: Number(record.changeDue || 0),
            items: Array.isArray(record.items) ? record.items : [],
            paidAt: record.paidAt || record.createdAt,
          };
          renderReceipt({
            id: record.id,
            amount: Number(record.amount || 0),
            changeDue: Number(record.changeDue || 0),
            paidAt: record.paidAt || record.createdAt,
            petName: record.petName || null,
            receipt: receiptData,
          }, receiptData.items.length ? receiptData.items : [{ name: record.description || 'Walk-in sale', quantity: 1, unitPrice: Number(record.amount || 0), lineTotal: Number(record.amount || 0) }], receiptData.paymentMethod || record.paymentMethod || 'cash', receiptData.tenderedAmount || record.tenderedAmount || Number(record.amount || 0), receiptData.customerName || record.customerName || 'Walk-in customer');
        });
      });
    }

    async function loadSavedReceipts() {
      try {
        const records = await apiGet('/admin/cash-transactions');
        renderSavedReceipts(Array.isArray(records) ? records.filter((record) => record.type === 'walk-in') : []);
      } catch (error) {
        document.getElementById('saved-receipts').innerHTML = '<div class="empty">Unable to load saved receipts.</div>';
      }
    }

    productContainer.addEventListener('click', (event) => {
      const button = event.target.closest('[data-product-id]');
      if (!button) return;
      const product = catalog.find((item) => item.id === button.dataset.productId);
      if (product) addItem({
        name: product.label,
        unitPrice: product.price,
        category: product.category,
        kind: product.kind,
        unit: product.unit,
        ...(product.kind === 'product' ? {
          inventoryId: product.inventoryId,
          stockQuantity: product.quantity,
          unit: product.unit,
        } : {}),
      });
    });

    cartRows.addEventListener('click', (event) => {
      const button = event.target.closest('[data-cart-action]');
      if (!button) return;
      const index = Number(button.dataset.index);
      const item = cart[index];
      if (!item) return;
      if (button.dataset.cartAction === 'increase') {
        if (item.inventoryId && item.quantity >= item.stockQuantity) {
          showMessage(`Only ${item.stockQuantity} ${item.unit || 'unit(s)'} of this product are in stock.`, 'error');
          return;
        }
        item.quantity += 1;
      }
      if (button.dataset.cartAction === 'decrease') item.quantity = Math.max(1, item.quantity - 1);
      if (button.dataset.cartAction === 'remove') cart.splice(index, 1);
      renderCart();
    });

    document.querySelector('.pos-categories').addEventListener('click', (event) => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      categoryFilter = button.dataset.category;
      document.querySelectorAll('.pos-categories button').forEach((option) => {
        option.setAttribute('aria-pressed', String(option === button));
      });
      renderProducts();
    });

    document.querySelectorAll('input[name="paymentMethod"]').forEach((input) => input.addEventListener('change', updateTender));
    cashReceived.addEventListener('input', updateTender);
    salesPeriod.addEventListener('change', loadSalesAnalytics);

    document.getElementById('clear-cart').addEventListener('click', () => {
      cart.splice(0, cart.length);
      cashReceived.value = '';
      renderCart();
    });

    document.getElementById('pos-checkout').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!cart.length || !event.currentTarget.reportValidity()) return;
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const amount = saleTotal();
      const tenderedAmount = paymentMethod === 'cash' ? Number(cashReceived.value) : amount;
      if (paymentMethod === 'cash' && tenderedAmount < amount) {
        showMessage('Cash received must cover the total due.', 'error');
        return;
      }
      const sale = cart.map((item) => ({ ...item }));
      const customerName = document.getElementById('sale-customer').value.trim() || 'Walk-in customer';
      checkoutButton.disabled = true;
      checkoutButton.textContent = 'Processing…';
      try {
        const result = await apiPost('/admin/cash-transactions', {
          type: 'walk-in',
          customerName,
          contact: document.getElementById('sale-contact').value.trim(),
          paymentMethod,
          tenderedAmount,
          petName: petNameInput.value.trim(),
          items: sale.map(({ name, quantity, unitPrice, category, inventoryId }) => ({
            name, quantity, unitPrice, category,
            ...(inventoryId ? { inventoryId } : {}),
          })),
        });
        cart.splice(0, cart.length);
        cashReceived.value = '';
        petNameInput.value = '';
        renderCart();
        document.getElementById('sale-contact').value = '';

        if (paymentMethod === 'qrph' && result.checkoutUrl) {
          const qrWindow = window.open(result.checkoutUrl, '_blank', 'width=430,height=760,noopener,noreferrer');
          if (qrWindow) {
            qrWindow.opener = null;
          }
          showMessage('PayMongo QR opened in a new window.', 'success');
          return;
        }

        showMessage('Sale recorded.', 'success');
        renderReceipt(result.transaction, sale, paymentMethod, tenderedAmount, customerName);
        await Promise.all([loadSavedReceipts(), loadSalesAnalytics()]);
      } catch (error) {
        showMessage(error.message || 'Unable to complete this sale.', 'error');
      } finally {
        checkoutButton.textContent = 'Complete sale';
        checkoutButton.disabled = !cart.length;
      }
    });

    Promise.all([apiGet('/admin/services'), apiGet('/inventory/products')]).then(([services, products]) => {
      const grooming = Array.isArray(services.grooming) ? services.grooming : [];
      const groomingCatalog = grooming
        .filter((service) => service && service.name && (service.name.startsWith('grooming-') || service.name.startsWith('ayurveda-')))
        .map((service) => ({
          id: service.name,
          label: displayName(service),
          price: Number(service.price),
          category: service.details && service.details.category || 'Service',
          kind: service.name.startsWith('ayurveda-') ? 'ayurveda' : 'grooming',
          description: service.details && service.details.description || '',
          duration: Number(service.details && service.details.duration) || 0,
          includes: Array.isArray(service.details && service.details.includes) ? service.details.includes : [],
          amenities: [],
          details: Array.isArray(service.details && service.details.includes) ? service.details.includes : [],
        }))
        .filter((service) => Number.isFinite(service.price) && service.price > 0);
      const hotel = Array.isArray(services.hotel) ? services.hotel : [];
      const hotelCatalog = hotel.flatMap((service) => Object.entries(service.rates || { weekday: service.price }).map(([rateType, price]) => ({
        id: `${service.name}-${rateType}`,
        label: `${service.details && service.details.category || 'Hotel'} ${displayName(service)} · ${capitalize(rateType)} rate`,
        price: Number(price),
        category: `Hotel - ${service.details && service.details.category || 'Service'}`,
        kind: 'hotel',
        unit: service.unit || 'night',
        description: service.details && service.details.description || '',
        occupancy: Number(service.details && service.details.occupancy) || 0,
        amenities: Array.isArray(service.details && service.details.amenities) ? service.details.amenities : [],
        weekdayRate: Number(service.rates && service.rates.weekday || service.price),
        weekendRate: Number(service.rates && service.rates.weekend || service.price),
        includes: [],
        details: Array.isArray(service.details && service.details.amenities) ? service.details.amenities : [],
      }))).filter((service) => Number.isFinite(service.price) && service.price > 0);
      catalog = [...groomingCatalog, ...hotelCatalog];
      catalog.push(...(Array.isArray(products) ? products : []).map((product) => ({
        id: `inventory-${product.id}`,
        inventoryId: String(product.id),
        label: product.name,
        price: Number(product.price),
        category: product.category || 'Product',
        kind: 'product',
        quantity: Number(product.quantity || 0),
        unit: product.unit || 'unit(s)',
        description: product.description || '',
        includes: [],
        amenities: [],
        details: [],
      })));
      renderProducts();
    }).catch((error) => {
      productContainer.innerHTML = '<div class="alert alert-error show">Unable to load services. Sign in again and retry.</div>';
      showMessage(error.message || 'Unable to load the service catalog.', 'error');
    });

    loadSavedReceipts();
    loadSalesAnalytics();
    renderCart();
  </script>
</body>
</html>
