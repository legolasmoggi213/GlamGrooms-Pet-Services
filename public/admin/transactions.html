<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash Transactions — Glam Grooms Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <h1>Cash Transactions</h1>
      <p class="page-sub">Record counter payments and walk-in sales.</p>

      <section class="panel">
        <h3>Record a transaction</h3>
        <form id="cash-form" class="form-grid">
          <div class="field">
            <label for="entry-type">Transaction type</label>
            <select id="entry-type" name="type">
              <option value="walk-in">Walk-in sale</option>
              <option value="booking-payment">Existing booking payment</option>
            </select>
          </div>

          <div class="field" id="walk-in-customer-field">
            <label for="customer-name">Customer name *</label>
            <input id="customer-name" name="customerName" required maxlength="120" />
          </div>
          <div class="field" id="walk-in-contact-field">
            <label for="contact">Contact (optional)</label>
            <input id="contact" name="contact" maxlength="160" />
          </div>
          <div class="field" id="walk-in-description-field">
            <label for="description">Item or service *</label>
            <input id="description" name="description" required maxlength="160" />
          </div>
          <div class="field" id="walk-in-amount-field">
            <label for="amount">Amount received (PHP) *</label>
            <input id="amount" name="amount" type="number" min="0.01" max="10000000" step="0.01" required />
          </div>

          <div id="booking-payment-fields" class="form-grid full" hidden>
            <div class="field">
              <label for="booking-type">Booking category</label>
              <select id="booking-type" name="bookingType" disabled>
                <option value="grooming">Grooming</option>
                <option value="hotel">Hotel</option>
              </select>
            </div>
            <div class="field">
              <label for="booking-id">Unpaid cash booking *</label>
              <select id="booking-id" name="bookingId" disabled required>
                <option value="">Loading bookings…</option>
              </select>
            </div>
            <p class="text-muted full" id="booking-amount-preview"></p>
          </div>

          <div class="field full">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="2" maxlength="500"></textarea>
          </div>
          <div class="field full">
            <button class="btn btn-primary" id="save-cash-transaction" type="submit">Record cash payment</button>
            <div id="cash-message" class="alert" role="status" aria-live="polite" hidden></div>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="flex-between">
          <h3>Recent transactions</h3>
          <span class="text-muted">Latest 100</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Paid at</th><th>Type</th><th>Customer</th><th>Item or booking</th><th>Method</th><th>Amount</th><th>Recorded by</th></tr>
            </thead>
            <tbody id="transaction-rows">
              <tr><td colspan="7" class="loading">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    renderSidebar('Cash Transactions');

    const form = document.getElementById('cash-form');
    const entryType = document.getElementById('entry-type');
    const bookingType = document.getElementById('booking-type');
    const bookingSelect = document.getElementById('booking-id');
    const bookingFields = document.getElementById('booking-payment-fields');
    const rows = document.getElementById('transaction-rows');
    const message = document.getElementById('cash-message');
    const saveButton = document.getElementById('save-cash-transaction');
    let availableBookings = { grooming: [], hotel: [] };
    let bookingByKey = new Map();

    const showMessage = (text, kind) => {
      message.textContent = text;
      message.className = `alert alert-${kind} show`;
      message.hidden = false;
    };

    const setEntryType = () => {
      const isBooking = entryType.value === 'booking-payment';
      bookingFields.hidden = !isBooking;
      bookingFields.querySelectorAll('input, select, textarea').forEach((field) => {
        field.disabled = !isBooking;
      });
      ['customer-name', 'contact', 'description', 'amount'].forEach((id) => {
        document.getElementById(id).disabled = isBooking;
      });
      saveButton.textContent = isBooking ? 'Record booking payment' : 'Record cash payment';
      renderBookingOptions();
    };

    const renderBookingOptions = () => {
      if (entryType.value !== 'booking-payment') return;
      const kind = bookingType.value;
      const items = availableBookings[kind] || [];
      bookingByKey = new Map(items.map((item) => [`${kind}:${item.id}`, item]));
      bookingSelect.innerHTML = '<option value="">Select an unpaid booking</option>' + items.map((item) => {
        const petName = item.Pet?.name || 'Pet';
        const customerName = item.Customer?.name || 'Customer';
        const date = kind === 'grooming' ? item.date : item.checkIn;
        const detail = kind === 'grooming' ? `${item.service} at ${item.time}` : `${item.roomType} check-in`;
        const amount = kind === 'grooming' ? item.price : item.totalPrice;
        const key = encodeURIComponent(JSON.stringify({ type: kind, id: item.id }));
        return `<option value="${key}">${escapeHtml(`${date} · ${detail} · ${petName} · ${customerName} · ${fmtMoney(amount)}`)}</option>`;
      }).join('');
      updateBookingAmount();
    };

    const updateBookingAmount = () => {
      const selected = bookingSelect.value;
      let item;
      try {
        const key = JSON.parse(decodeURIComponent(selected));
        item = bookingByKey.get(`${key.type}:${key.id}`);
      } catch {}
      const amount = item ? (keyAmount(item, bookingType.value)) : null;
      document.getElementById('booking-amount-preview').textContent = amount == null
        ? 'Select a booking to see the cash amount due.'
        : `Cash amount due: ${fmtMoney(amount)}`;
    };

    const keyAmount = (item, kind) => kind === 'grooming' ? item.price : item.totalPrice;

    async function loadBookings() {
      const [grooming, hotel] = await Promise.all([apiGet('/grooming'), apiGet('/hotel')]);
      const isUnpaidCash = (item) => (item.paymentMethod || 'cash') === 'cash'
        && !['paid', 'pending'].includes(item.paymentStatus)
        && item.status !== 'cancelled';
      availableBookings = {
        grooming: grooming.filter(isUnpaidCash),
        hotel: hotel.filter(isUnpaidCash),
      };
      renderBookingOptions();
    }

    async function loadTransactions() {
      const items = await apiGet('/admin/cash-transactions');
      if (!items.length) {
        rows.innerHTML = '<tr><td colspan="7" class="empty">No cash transactions recorded.</td></tr>';
        return;
      }
      rows.innerHTML = items.map((item) => {
        const typeLabel = item.type === 'walk-in' ? 'Walk-in sale' : `${capitalize(item.bookingType)} payment`;
        const detail = item.type === 'walk-in' ? item.description : `${item.description || 'Booking'} · ${item.bookingId}`;
        return `<tr>
          <td>${escapeHtml(fmtDateTime(item.paidAt))}</td>
          <td>${escapeHtml(typeLabel)}</td>
          <td>${escapeHtml(item.customerName)}</td>
          <td>${escapeHtml(detail)}</td>
          <td>${escapeHtml(capitalize(item.paymentMethod || 'cash'))}</td>
          <td>${fmtMoney(item.amount)}</td>
          <td>${escapeHtml(item.recordedBy)}</td>
        </tr>`;
      }).join('');
    }

    entryType.addEventListener('change', setEntryType);
    bookingType.addEventListener('change', renderBookingOptions);
    bookingSelect.addEventListener('change', updateBookingAmount);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const isBooking = entryType.value === 'booking-payment';
      let payload;
      if (isBooking) {
        try {
          const selected = JSON.parse(decodeURIComponent(bookingSelect.value));
          payload = { type: 'booking-payment', bookingType: selected.type, bookingId: selected.id, notes: form.notes.value };
        } catch {
          showMessage('Select an unpaid cash booking first.', 'error');
          return;
        }
      } else {
        payload = {
          type: 'walk-in',
          customerName: form.customerName.value,
          contact: form.contact.value,
          description: form.description.value,
          amount: form.amount.value,
          notes: form.notes.value,
        };
      }

      saveButton.disabled = true;
      try {
        await apiPost('/admin/cash-transactions', payload);
        form.reset();
        setEntryType();
        showMessage('Cash transaction recorded.', 'success');
        await Promise.all([loadBookings(), loadTransactions()]);
      } catch (error) {
        showMessage(error.message || 'Unable to record this cash transaction.', 'error');
      } finally {
        saveButton.disabled = false;
      }
    });

    setEntryType();
    Promise.all([loadBookings(), loadTransactions()]).catch((error) => {
      showMessage(error.message || 'Unable to load cash transaction data.', 'error');
      rows.innerHTML = '<tr><td colspan="7" class="alert alert-error">Unable to load transactions.</td></tr>';
    });
  </script>
</body>
</html>
