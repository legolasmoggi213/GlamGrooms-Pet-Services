<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment Receipt — Glam Grooms</title>
  <link rel="stylesheet" href="/css/style.css?v=responsive-global-20261028b" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <script src="/js/api.js?v=php-currency-20261027"></script>
</head>
<body class="receipt-page">
  <main class="section">
    <div class="form-card receipt-confirmation">
      <h2 id="payment-title">Confirming your payment</h2>
      <p id="payment-message" class="text-muted" role="status" aria-live="polite">Please wait while we verify your GCash payment.</p>
      <a class="btn btn-outline" href="/customer/account.html">Go to My Account</a>
    </div>
  </main>
  <script>
    (async () => {
      const message = document.getElementById('payment-message');
      const params = new URLSearchParams(location.search);
      let pendingBooking = {};
      try {
        pendingBooking = JSON.parse(sessionStorage.getItem('pending_paymongo_booking') || '{}');
      } catch (error) {
        console.warn('Could not read pending PayMongo booking:', error);
      }
      const sessionCandidate = params.get('session_id') || pendingBooking.sessionId || '';
      const sessionId = /^cs_[A-Za-z0-9]+$/.test(sessionCandidate) ? sessionCandidate : '';
      const bookingType = params.get('booking_type') || pendingBooking.type || '';
      const bookingId = params.get('booking_id') || pendingBooking.id || '';
      const verifyPayload = { sessionId, bookingType, bookingId };
      if (!sessionId && (!['grooming', 'hotel'].includes(bookingType) || !bookingId)) {
        message.textContent = 'Payment return details are missing. Please do not pay again; contact the business if you were charged.';
        return;
      }
      const returnToProfileForRetry = () => {
        const returnParams = new URLSearchParams({ payment_pending: '1' });
        if (sessionId) returnParams.set('session_id', sessionId);
        if (['grooming', 'hotel'].includes(bookingType) && bookingId) {
          returnParams.set('booking_type', bookingType);
          returnParams.set('booking_id', bookingId);
        }
        window.location.replace(`/customer/account.html?${returnParams}`);
      };
      try {
        const result = await apiPost('/payments/verify', { sessionId });
        if (!result.receipt) throw new Error('Payment was verified, but the receipt is unavailable. Please contact the business.');
        const receipt = result.receipt;
        const receiptElement = document.getElementById('payment-receipt');
        const isHotel = receipt.bookingType === 'hotel';
        const service = String(receipt.service || (isHotel ? 'Pet hotel stay' : 'Grooming service'))
          .replace(/^grooming-/, '').replace(/-/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase());
        const schedule = isHotel
          ? `Check-in: ${fmtDate(receipt.checkIn)}${receipt.checkInTime ? ` at ${escapeHtml(receipt.checkInTime)}` : ''}<br>Check-out: ${fmtDate(receipt.checkOut)}${receipt.checkOutTime ? ` at ${escapeHtml(receipt.checkOutTime)}` : ''}`
          : `Appointment: ${fmtDate(receipt.date)} at ${escapeHtml(receipt.time || 'Time TBA')}${receipt.pickupTime ? `<br>Pickup: ${escapeHtml(receipt.pickupTime)}` : ''}`;
        const pets = Array.isArray(receipt.petNames) && receipt.petNames.length
          ? receipt.petNames.map(escapeHtml).join(', ')
          : '—';
        const services = isHotel && Array.isArray(receipt.petRooms) && receipt.petRooms.length
          ? receipt.petRooms.map((assignment) => `${escapeHtml(assignment.petName || 'Pet')}: ${escapeHtml(String(assignment.roomType || 'Room').replace(/^staycation-/, '').replace(/-/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase()))} — ${fmtMoney(assignment.pricePerNight)} per night`).join('<br>')
          : !isHotel && Array.isArray(receipt.petServices) && receipt.petServices.length
            ? receipt.petServices.map((assignment) => `${escapeHtml(assignment.petName || 'Pet')}: ${escapeHtml(String(assignment.service || '').replace(/^grooming-/, '').replace(/-/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase()))}`).join('<br>')
            : escapeHtml(service);
        receiptElement.innerHTML = `
          <div class="receipt-heading">
            <div class="receipt-mark">GG</div>
            <div><strong>Glam Grooms</strong><span>Pet Spa &amp; Hotel</span></div>
            <span class="receipt-paid">${isHotel ? 'Confirmed' : 'Paid'}</span>
          </div>
          <h3>Payment receipt</h3>
          <div class="receipt-meta"><span>Receipt #${escapeHtml(receipt.bookingId)}</span><span>${escapeHtml(fmtDateTime(receipt.paidAt))}</span></div>
          <div class="receipt-details">
            <div><span>Customer</span><strong>${escapeHtml(receipt.customerName || 'Customer')}</strong></div>
            <div><span>Pet${receipt.petNames && receipt.petNames.length === 1 ? '' : 's'}</span><strong>${pets}</strong></div>
            <div><span>${isHotel ? 'Stay' : 'Services'}</span><strong>${services}</strong></div>
            <div><span>Schedule</span><strong>${schedule}</strong></div>
            <div><span>Payment method</span><strong>GCash · PayMongo QR Ph</strong></div>
            <div><span>Payment reference</span><strong>${escapeHtml(receipt.paymentReference)}</strong></div>
          </div>
          <div class="receipt-total"><span>Total paid</span><strong>${fmtMoney(receipt.amount)}</strong></div>
          <div class="receipt-actions">
            <button class="btn btn-primary" type="button" id="print-receipt">Print receipt</button>
          </div>`;
        receiptElement.hidden = false;
        document.getElementById('payment-title').textContent = isHotel ? 'Reservation confirmed' : 'Payment received';
        message.textContent = isHotel
          ? 'Your GCash payment was received and your hotel reservation is confirmed.'
          : 'Your payment is confirmed. Here is your receipt.';
        document.getElementById('print-receipt').addEventListener('click', () => window.print());
      } catch (error) {
        if (error instanceof TypeError) {
          returnToProfileForRetry();
          return;
        }
        message.textContent = error.message || 'We could not verify the payment yet. Please contact the business if you were charged.';
      }
    })();
  </script>
</body>
</html>
