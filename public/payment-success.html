<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment Receipt — Glam Grooms</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
<body class="receipt-page">
  <main class="section">
    <div class="form-card receipt-confirmation">
      <h2 id="payment-title">Confirming your payment</h2>
      <p id="payment-message" class="text-muted" role="status" aria-live="polite">Please wait while we verify your GCash payment.</p>
      <a class="btn btn-outline" href="/customer/account.html">Go to My Account</a>
    </div>
  </main>
  <script>
    (async () => {
      const message = document.getElementById('payment-message');
      const params = new URLSearchParams(location.search);
      let pendingBooking = {};
      try {
        pendingBooking = JSON.parse(sessionStorage.getItem('pending_paymongo_booking') || '{}');
      } catch (error) {
        console.warn('Could not read pending PayMongo booking:', error);
      }
      const sessionCandidate = params.get('session_id') || pendingBooking.sessionId || '';
      const sessionId = /^cs_[A-Za-z0-9]+$/.test(sessionCandidate) ? sessionCandidate : '';
      const bookingType = params.get('booking_type') || pendingBooking.type || '';
      const bookingId = params.get('booking_id') || pendingBooking.id || '';
      const verifyPayload = { sessionId, bookingType, bookingId };
      if (!sessionId && (!['grooming', 'hotel'].includes(bookingType) || !bookingId)) {
        message.textContent = 'Payment return details are missing. Please do not pay again; contact the business if you were charged.';
        return;
      }
      const returnToProfileForRetry = () => {
        const returnParams = new URLSearchParams({ payment_pending: '1' });
        if (sessionId) returnParams.set('session_id', sessionId);
        if (['grooming', 'hotel'].includes(bookingType) && bookingId) {
          returnParams.set('booking_type', bookingType);
          returnParams.set('booking_id', bookingId);
        }
        window.location.replace(`/customer/account.html?${returnParams}`);
      };
      try {
        for (let attempt = 0; attempt < 20; attempt += 1) {
          const response = await fetch('/api/v1/payments/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(verifyPayload),
          });
          const result = await response.json().catch(() => ({}));

          if (response.status >= 500) {
            if (attempt < 3) {
              message.textContent = 'Our payment service is temporarily unavailable. Retrying verification…';
              await new Promise(resolve => setTimeout(resolve, 1500));
              continue;
            }
            returnToProfileForRetry();
            return;
          }

          if (response.status === 401 || response.status === 403) {
            const returnPath = `${location.pathname}${location.search}`;
            location.replace(`/customer/login.html?return=${encodeURIComponent(returnPath)}`);
            return;
          }

          if (response.status === 400 && result.error === 'Payment has not been completed.') {
            if (attempt < 19) {
              message.textContent = 'Payment is processing. Confirming your booking…';
              await new Promise(resolve => setTimeout(resolve, 1500));
              continue;
            }
            throw new Error(`PayMongo has not confirmed this payment yet. Please do not pay again if your wallet shows a completed charge. Contact the business with booking ${bookingId || 'unknown'}${sessionId ? ` and session ${sessionId}` : ''}.`);
          }

          if (!response.ok) throw new Error(result.error || `Payment verification failed (${response.status}).`);
          if (!result.receipt) throw new Error('Payment was verified, but the booking receipt is unavailable. Please contact the business.');

          const receipt = result.receipt;
          const redirectTarget = `/customer/account.html?payment_success=1&bookingType=${encodeURIComponent(receipt.bookingType)}&bookingId=${encodeURIComponent(receipt.bookingId)}`;
          sessionStorage.removeItem('pending_paymongo_booking');
          document.getElementById('payment-title').textContent = 'Payment received';
          message.textContent = 'Your payment is confirmed. Returning to your profile…';
          window.location.replace(redirectTarget);
          return;
        }
      } catch (error) {
        if (error instanceof TypeError) {
          returnToProfileForRetry();
          return;
        }
        message.textContent = error.message || 'We could not verify the payment yet. Please contact the business if you were charged.';
      }
    })();
  </script>
</body>
</html>
